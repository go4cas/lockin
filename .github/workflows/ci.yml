name: CI

on:
  pull_request:
  push:
    branches: [main]

# SA-16: the token can read the repo and nothing else. Actions are pinned to commit SHAs
# (the tag is in the comment); Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Code review LI-018: the real pages in a real browser, with the Playwright (and so the
  # Chromium build) pinned in tools/browser. Nothing in tools/browser is shipped.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun install --cwd tools/browser --frozen-lockfile
      - name: Install Chromium for the pinned Playwright
        working-directory: tools/browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: bun run --cwd tools/browser typecheck
      - run: bun run --cwd tools/browser checks dist/browser-checks
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-checks
          path: dist/browser-checks
          if-no-files-found: ignore
