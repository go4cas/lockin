name: Release

# SA-16: a tag such as v1.0.0 builds the binaries on GitHub, not on a laptop, so every
# published binary can be tied to a commit. Each one gets a SHA-256 file and a GitHub
# build attestation (check with: gh attestation verify lockin-linux-x64 -R go4cas/lockin).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check the tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - name: Build (AVX2 and baseline)
        run: |
          bun run build
          bun run build -- --baseline
      - name: Setup kit (deploy/ as lockin-deploy.tar.gz, so the server needs no git)
        run: |
          mkdir -p dist/kit/lockin-deploy
          cp -a deploy/. dist/kit/lockin-deploy/
          tar -C dist/kit --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -cf - lockin-deploy | gzip -n > dist/lockin-deploy.tar.gz
          rm -rf dist/kit
      - name: Checksums
        working-directory: dist
        run: |
          for f in lockin-linux-x64 lockin-linux-x64-baseline lockin-deploy.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/lockin-linux-x64
            dist/lockin-linux-x64-baseline
            dist/lockin-deploy.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Lock-In $GITHUB_REF_NAME" --generate-notes \
            dist/lockin-linux-x64 dist/lockin-linux-x64.sha256 \
            dist/lockin-linux-x64-baseline dist/lockin-linux-x64-baseline.sha256 \
            dist/lockin-deploy.tar.gz dist/lockin-deploy.tar.gz.sha256
