name: Release

# SA-16: a tag such as v1.0.0 builds the binaries on GitHub, not on a laptop, so every
# published binary can be tied to a commit. Each one gets a SHA-256 file and a GitHub
# build attestation (check with: gh attestation verify lockin-linux-x64 -R go4cas/lockin).
#
# A merge to main that changes "version" in package.json tags that commit (v + version) and
# releases it, so nobody tags by hand. A tag pushed by hand (v*.*.*) still releases too.
# The tag made here uses the workflow's own token, which starts no second run.

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the new tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag main when the version changed
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0; fi
          version=$(jq -r .version package.json)
          tag="v$version"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version \"$version\" is not x.y.z."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists: nothing to release."; exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $GITHUB_SHA as $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check the tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - name: Build (AVX2 and baseline)
        run: |
          bun run build
          bun run build -- --baseline
      - name: Setup kit (deploy/ as lockin-deploy.tar.gz, so the server needs no git)
        run: |
          mkdir -p dist/kit/lockin-deploy
          cp -a deploy/. dist/kit/lockin-deploy/
          tar -C dist/kit --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -cf - lockin-deploy | gzip -n > dist/lockin-deploy.tar.gz
          rm -rf dist/kit
      - name: Checksums
        working-directory: dist
        run: |
          for f in lockin-linux-x64 lockin-linux-x64-baseline lockin-deploy.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/lockin-linux-x64
            dist/lockin-linux-x64-baseline
            dist/lockin-deploy.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "Lock-In $TAG" --generate-notes \
            dist/lockin-linux-x64 dist/lockin-linux-x64.sha256 \
            dist/lockin-linux-x64-baseline dist/lockin-linux-x64-baseline.sha256 \
            dist/lockin-deploy.tar.gz dist/lockin-deploy.tar.gz.sha256
