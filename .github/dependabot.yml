# SA-16: weekly update proposals for the pinned GitHub Actions and the dev-only packages.
# Bun itself is pinned in ci.yml and watched by bun-release-check.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is the native compiler: it has no JavaScript compiler API (the
      # tests/helpers/baseline.ts guard uses one) and reads JSDoc in public/ differently.
      # Moving to it is its own piece of work, not a weekly bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: bun
    directory: /tools/browser
    schedule:
      interval: weekly
