<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up · Lock-In host</title>
<link rel="icon" href="/static/logo/lockin-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/shared/tokens.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/shared/base.css">
<link rel="stylesheet" href="/static/host/host.css">
</head>
<body class="host-auth">
<main class="auth-card">
  <h1>Set up Lock-In</h1>
  <p>Choose the host password. Anyone with it can run the quiz, so keep it to the people who host.</p>
  <form id="setup-form" novalidate>
    <label for="setup-code">Setup code</label>
    <input id="setup-code" name="setupCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" required>
    <p class="hint">It is printed in the server log when Lock-In starts. On the server, <code>lockin setup-code</code> shows it again.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="password2">Password again</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <button type="submit" class="primary">Set password</button>
  </form>
</main>
<script src="/static/host/auth.js"></script>
</body>
</html>
