<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Lock-In host</title>
<link rel="icon" href="/static/logo/lockin-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/shared/tokens.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/shared/base.css">
<link rel="stylesheet" href="/static/host/host.css">
</head>
<body class="host-auth">
<main class="auth-card">
  <span class="lockup" role="img" aria-label="Lock-In"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><circle class="mk-ring" cx="50" cy="50" r="38" stroke-dasharray="179 239" stroke-dashoffset="-60" transform="rotate(-90 50 50)"></circle><circle class="mk-arc" cx="50" cy="50" r="38" stroke-dasharray="54 239" transform="rotate(-90 50 50)"></circle><circle class="mk-hole" cx="50" cy="45" r="8"></circle><path class="mk-hole" d="M45 48 L55 48 L57 66 L43 66 Z"></path></svg><span class="lockup-word" aria-hidden="true">Lock-In</span></span>
  <h1>Sign in</h1>
  <form id="login-form" novalidate>
    <label for="password">Host password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <p class="hint">Forgotten it? Whoever looks after the server can run <code>lockin reset-password</code>, which gives a new setup code.</p>
</main>
<script src="/static/host/auth.js"></script>
</body>
</html>
