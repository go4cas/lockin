# Installed by deploy/setup.sh to /etc/systemd/journald@lockin.conf (docs/RELEASE.md, "Logs").
# Lock-In logs to the journal, including "Security: <event> from <ip>" lines (SA-17).
# Those hold visitors' IP addresses, so they are kept for 30 days, then dropped.
# It applies only to Lock-In's own journal namespace (LogNamespace=lockin), not to other
# apps on the same server. Read it with: journalctl --namespace=lockin
[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=500M
