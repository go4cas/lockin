# Installed by deploy/setup.sh to /etc/systemd/journald.conf.d/lockin.conf (docs/RELEASE.md, "Logs").
# Lock-In logs to the journal, including "Security: <event> from <ip>" lines (SA-17).
# Those hold visitors' IP addresses, so they are kept for 30 days, then dropped.
# This setting applies to the whole journal on this server.
[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=500M
